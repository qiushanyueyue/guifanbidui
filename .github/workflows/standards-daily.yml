name: standards daily incremental sync

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

jobs:
  incremental-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      STANDARDS_DATASET: v2
      CRAWLER_DELAY_SECONDS: "1.5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Migrate additive V2 schema
        run: python scripts/migrate_v2.py
      - name: Verify a conservative CSRES delta
        run: python scripts/verify_v2_csres.py --limit 25 --resume
      - name: Publish staged evidence through the quality gate
        run: python scripts/rebuild_v2.py
