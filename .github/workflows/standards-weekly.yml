name: standards weekly verification

on:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * 1"

permissions:
  contents: read

concurrency:
  group: standards-v2-sync
  cancel-in-progress: false

jobs:
  verify-existing:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      STANDARDS_DATASET: v2
      CRAWLER_DELAY_SECONDS: "1.5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Migrate additive V2 schema
        run: python scripts/migrate_v2.py
      - name: Verify a bounded V2 batch
        id: verify
        run: python scripts/verify_v2_csres.py --run-id-file "$RUNNER_TEMP/csres-run-id" --limit 100 --unknown-only
      - name: Publish staged evidence through the quality gate
        run: python scripts/rebuild_v2.py
      - name: Check this source batch after publication
        if: ${{ always() && steps.verify.outcome == 'success' }}
        run: python scripts/check_sync_health.py --source csres --run-id-file "$RUNNER_TEMP/csres-run-id" --max-failure-rate 0.5
      - name: Run golden decisions
        run: python scripts/run_golden_cases.py
