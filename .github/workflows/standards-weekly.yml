name: standards weekly verification

on:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * 1"

jobs:
  verify-existing:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      STANDARDS_DATASET: v2
      CRAWLER_DELAY_SECONDS: "1.5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Migrate additive V2 schema
        run: python scripts/migrate_v2.py
      - name: Verify a bounded V2 batch
        run: python scripts/verify_v2_csres.py --limit 100 --resume
      - name: Publish staged evidence through the quality gate
        run: python scripts/rebuild_v2.py
      - name: Run golden decisions
        run: python scripts/run_golden_cases.py
